<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Админка — Эвакуатор 32</title>
<style>
  :root { --red:#e11d2e; --ink:#14171a; --muted:#6b7480; --line:#e3e6ea; --bg:#f4f6f8; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; font-size:15px; line-height:1.5; }
  a { color:var(--red); }
  header { position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:14px; padding:12px 20px; }
  header h1 { font-size:17px; margin:0; flex:1; }
  header .who { font-size:12px; color:var(--muted); }
  main { max-width:960px; margin:0 auto; padding:22px 16px 90px; }
  .tabs { display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .tab { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 16px; cursor:pointer; font-weight:600; }
  .tab.on { background:var(--ink); color:#fff; border-color:var(--ink); }
  fieldset { border:1px solid var(--line); border-radius:14px; background:#fff; margin:0 0 16px; padding:14px 16px 16px; }
  legend { font-weight:800; font-size:14px; padding:0 6px; }
  label { display:block; font-size:12px; font-weight:700; color:var(--muted); margin:12px 0 4px; }
  input[type=text], input[type=number], textarea {
    width:100%; border:1px solid var(--line); border-radius:10px; padding:10px 12px; font:inherit; color:inherit; background:#fff; }
  textarea { min-height:70px; resize:vertical; }
  input:focus, textarea:focus { outline:2px solid var(--red); outline-offset:1px; border-color:var(--red); }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .item { border:1px dashed var(--line); border-radius:12px; padding:10px 12px 14px; margin:10px 0; background:#fbfcfd; }
  .item-head { display:flex; justify-content:space-between; align-items:center; font-weight:700; font-size:13px; }
  .btn { border:0; border-radius:10px; padding:10px 16px; font:inherit; font-weight:700; cursor:pointer; background:#eef1f4; color:var(--ink); }
  .btn.primary { background:var(--red); color:#fff; }
  .btn.ghost { background:transparent; border:1px solid var(--line); }
  .btn.sm { padding:6px 10px; font-size:13px; }
  .bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line);
         padding:12px 20px; display:flex; gap:12px; align-items:center; justify-content:flex-end; }
  .bar .status { margin-right:auto; font-size:13px; color:var(--muted); }
  .thumb { width:120px; height:80px; object-fit:cover; border-radius:10px; border:1px solid var(--line); display:block; margin:6px 0; background:#eef1f4; }
  .imgrow { display:flex; gap:12px; align-items:flex-end; }
  .imgrow > div { flex:1; }
  .login { max-width:560px; margin:8vh auto; background:#fff; border:1px solid var(--line); border-radius:16px; padding:24px; }
  .login h2 { margin:0 0 6px; }
  .login ol { padding-left:20px; color:var(--muted); font-size:14px; }
  .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:80px; background:var(--ink); color:#fff;
           padding:10px 18px; border-radius:999px; font-size:14px; opacity:0; pointer-events:none; transition:.2s; }
  .toast.on { opacity:1; }
  .hint { font-size:12px; color:var(--muted); margin:4px 0 0; }
  .post-title { font-weight:800; font-size:15px; margin:0 0 2px; }
  .post-meta { font-size:12px; color:var(--muted); }
  .backrow { margin:0 0 14px; display:flex; align-items:center; gap:10px; }
  body.md textarea.body-field { min-height:60vh; font-family:ui-monospace,Consolas,Menlo,monospace; font-size:13.5px; line-height:1.55; }
  [hidden] { display:none !important; }
</style>

// ── Настройки репозитория ───────────────────────────────────────────────────

const REPO = 'evakuator-bryansk';
const BRANCH = 'main';

// Админка лежит по адресу <base>/admin/ (на Pages — /evakuator-demo/admin/),
// а в данных пути к фото хранятся от корня сайта: /images/.... В браузере такой
// путь уходит на корень домена и картинка не грузится, поэтому подставляем base.
const BASE = location.pathname.replace(/\/admin\/?$/, '');
const imgUrl = (p) => {
  if (!p) return '';
  if (/^(?:[a-z]+:)?\/\//i.test(p) || p.startsWith('data:')) return p;
  return BASE + (p.startsWith('/') ? p : '/' + p);
};

// ── Какие данные редактируем ────────────────────────────────────────────────

// Вкладка «Статьи блога»: правка существующих .mdx через GitHub Contents API.
const BLOG_TAB = { id: 'blog', label: 'Статьи блога' };
const BLOG_DIR = 'src/content/blog';

// ── Утилиты ─────────────────────────────────────────────────────────────────
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    // Обработчики (onclick и т. п.) обязаны ставится свойством, а не атрибутом:
    // setAttribute превращает функцию в строку, и кнопка молча перестаёт работать.
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (typeof v === 'function') n[k] = v;
    else n.setAttribute(k, v);
  }
  for (const kid of kids) n.append(kid);
  return n;
};
const toast = (msg) => { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 2600); };
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'foto';
const b64 = (s) => btoa(unescape(encodeURIComponent(s)));
const unb64 = (s) => decodeURIComponent(escape(atob(s.replace(/\s/g, ''))));
const fileToB64 = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = rej; r.readAsDataURL(file); });

let token = localStorage.getItem('gh_token') || '';
let state = {};      // id -> { sha, data }
let active = DOCS[0].id;
let blog = { list: [], cur: null }; // cur = { path, sha, fm: {raw}, edit: {title, description, pubDate, image, body}, quoted: {} }

// ── GitHub API ──────────────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/${path}`, {
    ...opts,
    headers: {
      Authorization: `Bearer ${token}`,
      Accept: 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) throw new Error(`GitHub ${res.status}: ${(await res.text()).slice(0, 200)}`);
  return res.status === 204 ? null : res.json();
}
async function readDoc(doc) {
  const j = await api(`contents/${doc.file}?ref=${BRANCH}`);
  return { sha: j.sha, data: JSON.parse(unb64(j.content)) };
}
async function writeDoc(doc, message) {
  const { sha, data } = state[doc.id];
  const j = await api(`contents/${doc.file}`, {
    method: 'PUT',
    body: JSON.stringify({ message, content: b64(JSON.stringify(data, null, 2) + '\n'), sha, branch: BRANCH }),
  });
  state[doc.id].sha = j.content.sha;
}
async function uploadImage(file) {
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const name = `${slug(file.name.replace(/\.[^.]+$/, ''))}-${Date.now().toString().slice(-6)}.${ext}`;
  await api(`contents/public/images/${name}`, {
    method: 'PUT',
    body: JSON.stringify({ message: `фото: ${name}`, content: await fileToB64(file), branch: BRANCH }),
  });
  return `/images/${name}`;
}

// ── MDX статей: frontmatter правим ТОЛЬКО заменой строк отредактированных полей ──
// Все прочие строки YAML (списки tldr/faq/keywords, вложенности) остаются байт-в-байт —
// редактор физически не может их потерять или сломать.
function parseBlogMdx(text) {
  const m = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
  return m ? { fmText: m[1], body: (m[2] || '').replace(/^\r?\n/, '') } : { fmText: '', body: text };
}
const wasQuoted = (v) => /^["']/.test(v);
const stripQ = (v) => v.replace(/^["']([\s\S]*)["']$/, '$1');
function replaceFmKey(fmText, key, value) {
  let done = false;
  const out = fmText.split(/\r?\n/).map((l) => {
    if (done) return l;
    if (new RegExp(`^${key}:`).test(l)) { done = true; return `${key}: ${value}`; }
    return l;
  }).join('\n');
  return done ? out : (fmText.replace(/\s*$/, '') + `\n${key}: ${value}`);
}
// сохраняем исходный стиль кавычек (pubDate: "2026-10-10" как date в YAML не парсится!)
function quoteForYaml(was, v) {
  if (/["\n:,]/.test(v)) return JSON.stringify(v);
  return was ? JSON.stringify(v) : v;
}
function serializeBlogMdx(cur) {
  let fm = cur.fmText;
  fm = replaceFmKey(fm, 'title', quoteForYaml(cur.was.title, cur.edit.title));
  fm = replaceFmKey(fm, 'description', quoteForYaml(cur.was.description, cur.edit.description));
  if ((cur.edit.image || '').trim()) fm = replaceFmKey(fm, 'image', quoteForYaml(cur.was.image, cur.edit.image));
  if ((cur.edit.pubDate || '').trim()) fm = replaceFmKey(fm, 'pubDate', quoteForYaml(cur.was.pubDate, cur.edit.pubDate));
  return `---\n${fm}\n---\n\n${cur.edit.body ?? ''}`;
}

// ── Отрисовка формы ─────────────────────────────────────────────────────────
function fieldEl(spec, obj, key) {
  const label = el('label', {}, spec.label);
  if (spec.type === 'image') {
    const box = el('div', { class: 'imgrow' });
    const left = el('div');
    const thumb = el('img', { class: 'thumb', alt: '' });
    thumb.src = imgUrl(obj[key]);
    const input = el('input', { type: 'text' });
    input.value = obj[key] || '';
    input.oninput = () => { obj[key] = input.value; thumb.src = imgUrl(input.value); };
    const file = el('input', { type: 'file', accept: 'image/*' });
    file.onchange = async () => {
      if (!file.files[0]) return;
      try {
        toast('Загружаю фото…');
        const path = await uploadImage(file.files[0]);
        obj[key] = path; input.value = path; thumb.src = imgUrl(path);
        toast('Фото загружено. Не забудьте «Сохранить».');
      } catch (e) { toast('Ошибка загрузки: ' + e.message); }
    };
    left.append(label, thumb, input, el('p', { class: 'hint' }, 'Можно вставить путь вручную или выбрать файл (загрузится в public/images).'), file);
    box.append(left);
    return box;
  }
  let input;
  if (spec.type === 'textarea') { input = el('textarea'); input.value = obj[key] || ''; }
  else if (spec.type === 'number') { input = el('input', { type: 'number' }); input.value = obj[key] ?? ''; }
  else { input = el('input', { type: 'text' }); input.value = obj[key] || ''; }
  input.oninput = () => { obj[key] = spec.type === 'number' ? (input.value === '' ? '' : Number(input.value)) : input.value; };
  return el('div', {}, label, input);
}
function fieldsEl(fields, obj) {
  const frag = document.createDocumentFragment();
  for (const f of fields) {
    if (f.type === 'group') {
      obj[f.key] = obj[f.key] || {};
      frag.append(el('fieldset', {}, el('legend', {}, f.label), fieldsEl(f.fields, obj[f.key])));
    } else if (f.type === 'list') {
      obj[f.key] = obj[f.key] || [];
      frag.append(listEl(f, obj[f.key]));
    } else {
      frag.append(fieldEl(f, obj, f.key));
    }
  }
  return frag;
}
function listEl(spec, arr) {
  const box = el('div');
  const draw = () => {
    box.innerHTML = '';
    arr.forEach((item, i) => {
      const row = el('div', { class: 'item' });
      row.append(el('div', { class: 'item-head' },
        el('span', {}, `${spec.label} ${i + 1}`),
        el('button', { class: 'btn sm ghost', type: 'button', onclick: () => { arr.splice(i, 1); draw(); } }, 'Удалить')));
      if (spec.item.fields) {
        if (typeof item !== 'object' || item === null) arr[i] = item = {};
        row.append(fieldsEl(spec.item.fields, item));
      } else {
        const input = el('input', { type: 'text' });
        input.value = item || '';
        input.oninput = () => { arr[i] = input.value; };
        row.append(el('label', {}, 'Значение'), input);
      }
      box.append(row);
    });
    box.append(el('button', { class: 'btn sm', type: 'button', onclick: () => { arr.push(spec.item.fields ? {} : ''); draw(); } }, '+ Добавить'));
  };
  draw();
  return el('fieldset', {}, el('legend', {}, spec.label), box);
}

// ── Вкладка «Статьи блога» ──────────────────────────────────────────────────
async function renderBlogList(app) {
  $('#bar').hidden = true;
  const box = el('fieldset', {}, el('legend', {}, 'Статьи блога'));
  const list = el('div');
  box.append(list);
  app.append(box);
  const status = el('p', { class: 'hint' }, 'Загружаю список статей…');
  list.append(status);
  try {
    const j = await api(`contents/${BLOG_DIR}?ref=${BRANCH}`);
    blog.list = j.filter((x) => /\.(mdx|md)$/.test(x.name));
    list.innerHTML = '';
    if (!blog.list.length) list.append(el('p', { class: 'hint' }, 'Статей пока нет.'));
    for (const f of blog.list) {
      list.append(el('div', { class: 'item' },
        el('div', { class: 'item-head' },
          el('span', {}, f.name.replace(/\.(mdx|md)$/, '')),
          el('button', { class: 'btn sm primary', type: 'button', onclick: () => openBlogPost(f.path, f.name) }, 'Редактировать'))));
    }
  } catch (e) {
    status.textContent = 'Не удалось загрузить список: ' + e.message;
  }
}

async function openBlogPost(path, name) {
  try {
    toast('Загружаю статью…');
    const j = await api(`contents/${path}?ref=${BRANCH}`);
    const parsed = parseBlogMdx(unb64(j.content));
    const fv = (k) => { const m = parsed.fmText.match(new RegExp(`^${k}:[ \\t]*(.*)$`, 'm')); return m ? m[1].trim() : ''; };
    blog.cur = {
      path, sha: j.sha, name,
      fmText: parsed.fmText,
      was: { title: wasQuoted(fv('title')), description: wasQuoted(fv('description')), image: wasQuoted(fv('image')), pubDate: wasQuoted(fv('pubDate')) },
      edit: {
        title: stripQ(fv('title')),
        description: stripQ(fv('description')),
        pubDate: stripQ(fv('pubDate')),
        image: stripQ(fv('image')),
        body: parsed.body,
      },
    };
    renderApp();
  } catch (e) { toast('Ошибка: ' + e.message); }
}

function renderBlogPost(app) {
  const cur = blog.cur;
  $('#bar').hidden = false;
  $('#status').textContent = `Редактируем статью: ${cur.name}`;
  const e = cur.edit;
  const wrap = el('div', { class: 'md' });
  wrap.append(el('div', { class: 'backrow' },
    el('button', { class: 'btn sm ghost', type: 'button', onclick: () => { blog.cur = null; active = BLOG_TAB.id; renderBlogList($('#app')); } }, '← Все статьи'),
    el('span', { class: 'hint' }, 'После «Сохранить» сайт обновится сам (1–2 мин)')));
  wrap.append(fieldsEl([
    { key: 'title', label: 'Заголовок статьи', type: 'text' },
    { key: 'description', label: 'Описание (description для поиска)', type: 'textarea' },
    { key: 'pubDate', label: 'Дата публикации (ГГГГ-ММ-ДД)', type: 'text' },
    { key: 'image', label: 'Обложка', type: 'image' },
  ], e));
  // Лимит схемы сайта: description ≤ 165 знаков — счётчик прямо у поля
  const desc = wrap.querySelector('textarea');
  const counter = el('p', { class: 'hint' });
  desc.after(counter);
  const upd = () => {
    const n = desc.value.length;
    counter.textContent = `${n}/165 знаков` + (n > 165 ? ' — СЛИШКОМ ДЛИННО, сайт не соберётся! Убери лишнее.' : '');
    counter.style.color = n > 165 ? 'var(--red)' : '';
    counter.style.fontWeight = n > 165 ? '700' : '';
  };
  const prev = desc.oninput;
  desc.oninput = () => { prev.call(desc); upd(); };
  upd();
  const bodyLabel = el('label', {}, 'Текст статьи (разметка: ## заголовки, **жирный**, - списки. Ничего не удаляй лишнего)');
  const bodyField = el('textarea', { class: 'body-field' });
  bodyField.value = e.body;
  bodyField.oninput = () => { e.body = bodyField.value; };
  wrap.append(el('fieldset', {}, el('legend', {}, 'Текст статьи'), bodyLabel, bodyField));
  app.append(wrap);
  document.body.classList.add('md');
}

// ── Роут вкладок ─────────────────────────────────────────────────────────────
function renderApp() {
  const app = $('#app');
  app.innerHTML = '';
  document.body.classList.remove('md');
  const authed = !!token;
  if (!authed) return renderLogin(app);
  if (!state[DOCS[0].id]) return renderLogin(app);

  const tabs = el('div', { class: 'tabs' });
  for (const d of [...DOCS, BLOG_TAB]) {
    tabs.append(el('button', { class: 'tab' + (d.id === active ? ' on' : ''), type: 'button', onclick: () => { active = d.id; renderApp(); } }, d.label));
  }
  app.append(tabs);
  if (active === BLOG_TAB.id) {
    if (blog.cur) return renderBlogPost(app);
    return renderBlogList(app);
  }
  const doc = DOCS.find((d) => d.id === active);
  const wrap = el('div', { id: 'form' });
  app.append(wrap);
  wrap.append(fieldsEl(doc.fields, state[doc.id].data));
  $('#bar').hidden = false;
  $('#status').textContent = `Редактируем: ${doc.label}`;
}

function renderLogin(app) {
  $('#bar').hidden = true;
  const box = el('div', { class: 'login' });
  box.append(el('h2', {}, 'Вход в редактор сайта'));
  box.append(el('p', {}, 'Нужен токен GitHub с правом «Contents: Read and write» на репозиторий сайта. Он хранится только в вашем браузере.'));
  box.append(el('ol', {}, el('li', {}, 'Откройте github.com/settings/personal-access-tokens/new'), el('li', {}, 'Repository access → Only select repositories → evakuator-bryansk'), el('li', {}, 'Permissions → Repository permissions → Contents → Read and write'), el('li', {}, 'Generate token и вставьте его сюда')));
  const input = el('input', { type: 'text', placeholder: 'github_pat_…' });
  const btn = el('button', { class: 'btn primary', type: 'button' }, 'Войти');
  btn.onclick = async () => {
    token = input.value.trim();
    if (!token) return;
    localStorage.setItem('gh_token', token);
    await boot();
  };
  box.append(el('label', {}, 'Токен GitHub'), input, el('div', { style: 'margin-top:12px' }, btn));
  box.append(el('p', { class: 'hint', style: 'margin-top:14px' },
    'Заявки (лиды) — отдельная страница: ', el('a', { href: '../manage/', target: '_blank', rel: 'noopener' }, 'evakuator32-br.ru/manage/')));
  app.append(box);
}

async function boot() {
  try {
    $('#who').textContent = 'загрузка…';
    for (const d of DOCS) state[d.id] = await readDoc(d);
    $('#who').textContent = 'подключено';
    $('#logout').hidden = false;
    renderApp();
  } catch (e) {
    $('#who').textContent = '';
    toast('Не удалось подключиться: ' + e.message);
    token = '';
    localStorage.removeItem('gh_token');
    renderApp();
  }
}

$('#save').onclick = async () => {
  try {
    $('#save').disabled = true;
    $('#status').textContent = 'Сохраняю…';
    if (active === BLOG_TAB.id && blog.cur) {
      if (!blog.cur.edit.title.trim()) throw new Error('Заголовок не может быть пустым');
      if (blog.cur.edit.description.length > 165) throw new Error('Description длиннее 165 знаков — сайт с этим не соберётся. Укороти.');
      blog.cur.edit.body = blog.cur.edit.body.replace(/^\r?\n/, '');
      const text = serializeBlogMdx(blog.cur);
      const j = await api(`contents/${blog.cur.path}`, {
        method: 'PUT',
        body: JSON.stringify({ message: `админка: правка статьи ${blog.cur.name}`, content: b64(text), sha: blog.cur.sha, branch: BRANCH }),
      });
      blog.cur.sha = j.commit.sha;
      $('#status').textContent = 'Сохранилось ✓ — смотрю сборку сайта…';
      toast('Сохранилось ✓');
      pollBuild(j.commit.sha);
    } else if (state[active]) {
      const doc = DOCS.find((d) => d.id === active);
      await writeDoc(doc, `админка: правка «${doc.label}»`);
      $('#status').textContent = 'Сохранено. Сайт пересоберётся автоматически (1–2 мин).';
    }
    toast('Сохранено ✓');
  } catch (e) {
    toast('Ошибка: ' + e.message);
    $('#status').textContent = 'Не сохранилось';
  } finally {
    $('#save').disabled = false;
  }
};
// Честный статус сборки: по SHA коммита смотрим GitHub Actions до результата
async function pollBuild(commitSha) {
  for (let i = 0; i < 24; i++) {
    await new Promise((r) => setTimeout(r, 20000));
    try {
      const runs = await api(`actions/runs?head_sha=${commitSha}&per_page=1`);
      const r = runs.workflow_runs && runs.workflow_runs[0];
      if (!r) continue;
      if (r.status !== 'completed') { $('#status').textContent = `Сборка сайта идёт… (${Math.round((i + 1) * 20 / 60)} мин)`; continue; }
      if (r.conclusion === 'success') {
        $('#status').textContent = '✅ Сборка прошла — сайт обновлён. Обнови страницу сайта (Ctrl+F5).';
        toast('✅ Сайт обновлён');
      } else {
        $('#status').textContent = '❌ Сборка упала — сайт НЕ обновился. Напиши мне в чат.';
        toast('❌ Сборка упала');
      }
      return;
    } catch { /* сеть дёрнулась — ждём дальше */ }
  }
  $('#status').textContent = 'Сборка долго не отвечает — проверь позже или напиши мне в чат.';
}

$('#logout').onclick = () => { token = ''; localStorage.removeItem('gh_token'); $('#logout').hidden = true; renderApp(); };

if (token) boot(); else renderApp();
</script>
